<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  overflow: hidden;
}

.poyo {
  width: 200px;
  height: auto;
  display: block;
  transform-origin: center bottom;
  animation: poyoBounce 1.6s ease-in-out infinite;
}

/* ★ 躍動感強化版 */
@keyframes poyoBounce {

  0% {
    transform: translateY(0) scaleX(1.00) scaleY(1.00);
  }

  /* 1回目 上昇 */
  18% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  /* 滞空 */
  32% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  44% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  /* ★ 着地グシャッ（強） */
  52% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }

  /* ★ 崩れ維持（ここで躍動感） */
  58% {
    transform: translateY(2px) scaleX(1.16) scaleY(0.84);
  }

  /* 戻り */
  64% {
    transform: translateY(0) scaleX(1.03) scaleY(0.97);
  }

  /* 2回目 上昇（間なし） */
  74% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  /* 滞空 */
  86% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  /* 2回目 降下 */
  94% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  /* ★ 2回目グシャッ */
  100% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }
}
</style>

</head>

<body>

<img src="ララピージャンピングポーズ.png" class="poyo">

</body>
</html>
