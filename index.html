<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  overflow: hidden;
}

.poyo {
  width: 200px;
  height: auto;
  display: block;
  transform-origin: center bottom;
  animation: poyoBounce 2.0s ease-in-out infinite;
}

@keyframes poyoBounce {
  0% {
    transform: translateY(0) scaleX(1.00) scaleY(1.00);
  }

  /* 1回目 */
  12% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  22% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  30% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  36% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }

  42% {
    transform: translateY(2px) scaleX(1.15) scaleY(0.85);
  }

  48% {
    transform: translateY(0) scaleX(1.03) scaleY(0.97);
  }

  /* 2回目 */
  58% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  68% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  76% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  82% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }

  86% {
    transform: translateY(2px) scaleX(1.12) scaleY(0.88);
  }

  /* 余韻を短めに */
  89% {
    transform: translateY(0) scaleX(1.04) scaleY(0.96);
  }

  /* 3回目：少し早め・少し軽め */
  93% {
    transform: translateY(-66px) scaleX(0.97) scaleY(1.04);
  }

  96% {
    transform: translateY(-70px) scaleX(0.98) scaleY(1.03);
  }

  100% {
    transform: translateY(0) scaleX(1.10) scaleY(0.90);
  }
}
</style>

</head>
<body>

<img src="ララピージャンピングポーズ.png" alt="ララピー" class="poyo">

</body>
</html>
