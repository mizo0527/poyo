<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  overflow: hidden;
}

.poyo {
  width: 200px;
  height: auto;
  display: block;
  transform-origin: center bottom;
  animation: poyoBounce 2.05s ease-in-out infinite;
}

@keyframes poyoBounce {
  0% {
    transform: translateY(0) scaleX(1.00) scaleY(1.00);
  }

  /* 1回目 上昇 */
  12% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  /* 1回目 滞空 */
  22% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  30% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  /* 1回目 着地グシャ */
  36% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }

  /* 1回目 ポニョーーん */
  42% {
    transform: translateY(2px) scaleX(1.15) scaleY(0.85);
  }

  /* ちょい戻る */
  48% {
    transform: translateY(0) scaleX(1.03) scaleY(0.97);
  }

  /* 2回目 上昇 */
  58% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  /* 2回目 滞空 */
  68% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  76% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  /* 2回目 着地グシャ */
  82% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }

  /* 2回目 ポニョーーん */
  86% {
    transform: translateY(2px) scaleX(1.14) scaleY(0.86);
  }

  /* ここが“ぴょぴょーん”前のタメ */
  90% {
    transform: translateY(0) scaleX(1.00) scaleY(1.00);
  }

  /* 3回目 ちょい素早く小さめ */
  95% {
    transform: translateY(-72px) scaleX(0.96) scaleY(1.05);
  }

  98% {
    transform: translateY(-76px) scaleX(0.97) scaleY(1.04);
  }

  100% {
    transform: translateY(0) scaleX(1.10) scaleY(0.90);
  }
}
</style>
</head>
<body>

<img src="ララピージャンピングポーズ.png" class="poyo">

</body>
</html>
