<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  overflow: hidden;
}

.poyo {
  width: 200px;
  height: auto;
  display: block;
  transform-origin: center bottom;
  animation: poyoLoop 0.95s linear infinite;
}

@keyframes poyoLoop {
  /* 通常 */
  0% {
    transform: translateY(0) scaleX(1.00) scaleY(1.00);
  }

  /* 上昇 */
  20% {
    transform: translateY(-95px) scaleX(0.94) scaleY(1.08);
  }

  /* 滞空 */
  35% {
    transform: translateY(-100px) scaleX(0.95) scaleY(1.07);
  }

  /* 降下 */
  50% {
    transform: translateY(-95px) scaleX(0.96) scaleY(1.05);
  }

  /* ぐちゃ */
  62% {
    transform: translateY(3px) scaleX(1.18) scaleY(0.82);
  }

  /* ぐちゃ余韻 */
  72% {
    transform: translateY(2px) scaleX(1.14) scaleY(0.86);
  }

  /* 戻る */
  100% {
    transform: translateY(0) scaleX(1.00) scaleY(1.00);
  }
}
</style>

</head>
<body>

<img src="ララピージャンピングポーズ.png" alt="ララピー" class="poyo">

</body>
</html>
